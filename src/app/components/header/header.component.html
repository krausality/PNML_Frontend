<!-- 
  Semantisches <header>-Element für die Barrierefreiheit und klare Struktur.
  Die .banner-container-Klasse dient als Flexbox-Container für die Ausrichtung.
  
  HINWEIS: Die Logos wurden aus dem Header entfernt und in den Footer verschoben,
  um die Markensichtbarkeit zu verbessern (siehe footer.component für Logo-Implementierung).
  Der Header zeigt nun ausschließlich den Projekttitel.
-->
<header class="banner-container">
  <!-- Container für den Projektnamen -->
  <div class="project-title">
    <span>L3S-Offshore-2 Playground</span>
  </div>
</header>
